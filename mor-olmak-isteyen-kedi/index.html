<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241b35"><title>Mor Olmak İsteyen Kedi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#241b35;color:white;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px}.top strong{font-size:clamp(14px,3vw,19px);text-align:center}.top a{color:white;text-decoration:none;font-size:14px}.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 10px;touch-action:pan-y}.pages{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%;gap:0;filter:drop-shadow(0 9px 20px #0007)}.pages img{display:block;object-fit:contain;max-height:calc(100dvh - 145px);max-width:min(94vw,calc(100dvh - 145px));width:auto;height:auto;user-select:none;-webkit-user-drag:none}.pages.double img{max-width:min(47vw,calc((100dvh - 145px) / 1));}.bottom{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 12px max(14px,env(safe-area-inset-bottom));}.bottom button,.top button{border:1px solid #ffffff55;border-radius:14px;background:#ffffff1c;color:white;padding:10px 15px;font-size:16px;cursor:pointer}.bottom button:disabled{opacity:.3}.count{min-width:95px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;color:#eee}.hint{font-size:11px;text-align:center;color:#bdb2ce;padding-bottom:5px}@media(orientation:landscape){.top{padding:5px 12px}.bottom{padding:4px 12px 7px}.hint{display:none}.pages img{max-height:calc(100dvh - 88px);max-width:min(90vw,calc(100dvh - 88px))}.pages.double img{max-width:min(46vw,calc(100dvh - 88px))}}@media(prefers-reduced-motion:no-preference){.pages img{animation:appear .18s ease-out}@keyframes appear{from{opacity:.6;transform:scale(.99)}to{opacity:1;transform:scale(1)}}}
</style></head>
<body><header class="top"><a href="../" aria-label="Kitaplığa dön">‹ Kitaplık</a><strong>Mor Olmak İsteyen Kedi</strong><button id="full" aria-label="Tam ekran">⛶</button></header><main class="stage" id="stage" aria-label="Kitap sayfaları"><div class="pages" id="pages"></div></main><footer><div class="bottom"><button id="prev" aria-label="Önceki sayfa">❮</button><span class="count" id="count"></span><button id="next" aria-label="Sonraki sayfa">❯</button></div><div class="hint">Sayfa çevirmek için sağa veya sola kaydır</div></footer>
<script>
(()=>{'use strict';const TOTAL=34;let page=0;const pages=document.getElementById('pages'),counter=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');const path=n=>'sayfalar/sayfa_'+String(n).padStart(2,'0')+'.jpg';const wide=()=>matchMedia('(orientation: landscape)').matches && innerWidth>innerHeight;function shown(){if(!wide()||page===0||page===TOTAL-1)return [page];let first=page%2===1?page:page-1;return [first,first+1].filter(x=>x<TOTAL)}function render(){const arr=shown();pages.className='pages'+(arr.length===2?' double':'');pages.replaceChildren(...arr.map(i=>{let im=document.createElement('img');im.src=path(i+1);im.alt='Kitap sayfası '+(i+1);im.draggable=false;return im}));counter.textContent=arr.map(i=>i+1).join('–')+' / '+TOTAL;prev.disabled=page===0;next.disabled=page===TOTAL-1;for(let i=1;i<=Math.min(TOTAL,page+5);i++){if(i>page+1){let im=new Image();im.src=path(i)}}}function go(dir){if(dir>0){const a=shown();page=Math.min(TOTAL-1,a[a.length-1]+1)}else{page=Math.max(0,page-(wide()&&page>1?2:1))}render()}prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let sx=0,sy=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25)go(dx<0?1:-1)},{passive:true});stage.addEventListener('click',e=>{if(e.clientX<innerWidth*.25)go(-1);else if(e.clientX>innerWidth*.75)go(1)});addEventListener('resize',render);render()})();
</script></body></html>
