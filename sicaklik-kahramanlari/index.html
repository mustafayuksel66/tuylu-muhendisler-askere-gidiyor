<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17283c">
<title>Tüylü Mühendisler — Sıcaklık Kahramanları Merkezi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17283c;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;flex-direction:column}.top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px;background:#102033}.title{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 10px;touch-action:pan-y}.spread{display:flex;justify-content:center;align-items:center;max-width:100%;max-height:100%;filter:drop-shadow(0 8px 16px #0008)}.page{display:block;max-width:100%;max-height:calc(100dvh - 130px);object-fit:contain;aspect-ratio:1/1;background:#eee}.page[hidden]{display:none}.bottom{height:64px;display:flex;align-items:center;justify-content:center;gap:18px;padding:8px;background:#102033}button{border:0;border-radius:12px;background:#e7f0ff;color:#17283c;font-size:18px;min-width:48px;min-height:42px;cursor:pointer}button:disabled{opacity:.35}.count{min-width:90px;text-align:center;font-size:14px}.fullscreen{min-width:40px;font-size:16px}.back{font-size:13px;text-decoration:none;color:#e7f0ff;white-space:nowrap}@media(orientation:landscape){.top{height:36px}.bottom{height:44px;padding:3px}.book-area{padding:4px}.page{max-height:calc(100dvh - 88px)}button{min-height:34px}}
</style>
</head>
<body>
<header class="top"><div class="title">Tüylü Mühendisler: Sıcaklık Kahramanları Merkezi</div><button class="fullscreen" id="full" aria-label="Tam ekran">⛶</button></header>
<main class="book-area" id="area" aria-label="Kitap sayfaları"><div class="spread" id="spread"><img class="page" id="left" alt="Kitap sayfası"><img class="page" id="right" alt="Kitap sayfası" hidden></div></main>
<footer class="bottom"><button id="prev" aria-label="Önceki sayfa">❮</button><div class="count" id="count" aria-live="polite"></div><button id="next" aria-label="Sonraki sayfa">❯</button></footer>
<script>
'use strict';
const TOTAL=36;
const path=n=>'sayfalar/sayfa_'+String(n).padStart(2,'0')+'.jpg';
const left=document.getElementById('left'),right=document.getElementById('right');
const count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
let current=1;
function wide(){return matchMedia('(orientation: landscape)').matches && innerWidth>innerHeight}
function pages(){
 if(!wide())return [current];
 const first=current%2===1?current:current-1;
 return [first,first+1].filter(n=>n<=TOTAL);
}
function render(){
 const p=pages();
 left.hidden=false;
 right.hidden=p.length<2;
 left.src=path(p[0]);left.alt='Sayfa '+p[0];
 if(p.length===2){right.src=path(p[1]);right.alt='Sayfa '+p[1]}
 else right.removeAttribute('src');
 count.textContent=p.length===1?`${p[0]} / ${TOTAL}`:`${p[0]}–${p[1]} / ${TOTAL}`;
 prev.disabled=p[0]===1;next.disabled=p[p.length-1]===TOTAL;
 [left,right].forEach(img=>img.onerror=()=>{img.alt='Görsel yüklenemedi: '+img.src});
}
function move(dir){
 const p=pages();
 if(dir>0){if(p[p.length-1]>=TOTAL)return;current=p[p.length-1]+1}
 else{if(p[0]<=1)return;current=wide()?Math.max(1,p[0]-2):p[0]-1}
 render();
}
prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
let x=0,y=0;const area=document.getElementById('area');area.addEventListener('touchstart',e=>{x=e.changedTouches[0].screenX;y=e.changedTouches[0].screenY},{passive:true});area.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-x,dy=e.changedTouches[0].screenY-y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1)},{passive:true});
area.addEventListener('click',e=>{if(e.target.closest('button'))return;const r=area.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)});
document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})});
addEventListener('resize',render);screen.orientation?.addEventListener?.('change',render);render();
</script>
</body>
</html>
